name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the older run of the same branch: nobody waits for outdated results
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-nest
    env:
      # `npm ci` runs `prisma generate` (the postinstall script), which may read DATABASE_URL.
      # A placeholder is enough: nothing connects to a database here
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-nest/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend (lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
