name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push cancels the older run of the same branch: nobody waits for outdated results
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only needs to read the code
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-nest
    env:
      # `npm ci` runs `prisma generate` (the postinstall script), which may read DATABASE_URL.
      # A placeholder is enough: nothing connects to a database here
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-nest/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration:
    name: Backend (tests on a real PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-nest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests refuse any database that is not on this machine and whose name has no "test"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_test
      # Only for `npm ci` (prisma generate): nothing connects to it
      DATABASE_URL: postgresql://user:password@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server-nest/package-lock.json
      - run: npm ci
      # Builds the schema from the FIRST migration on the empty database: it proves the whole
      # history of migrations works from zero
      - name: Apply every migration to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run test:integration

  frontend:
    name: Frontend (lint, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
